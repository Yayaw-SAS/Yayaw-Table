name: Version and publish

# Releasing used to mean running `bun run version` locally, committing the bump
# and pushing a tag by hand, so described changes sat unreleased. Main now keeps
# a version pull request current; merging it publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # A tag pushed with GITHUB_TOKEN starts no workflow run, so this job asks for
  # the Release run itself. Dispatching one needs `actions: write`; without it
  # the request is refused with "Resource not accessible by integration" and the
  # version is tagged but never published.
  actions: write
  contents: write
  pull-requests: write

# Never let two pushes race the same bump or tag.
concurrency:
  group: table-version
  cancel-in-progress: false

env:
  VERSION_BRANCH: changeset-release/main

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Tags decide whether the described version is already published.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify release guards
        run: node --test .github/scripts/*.test.mjs

      # A release is described by a changeset or, failing that, by the
      # conventional commits merged since the last tag.
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          last="v$(node -p 'require("./package.json").version')"
          if git rev-parse --verify --quiet "refs/tags/$last" >/dev/null; then
            commits="$(git log --no-merges --format=%s "${last}..HEAD")"
          else
            commits=""
          fi
          RELEASE_TAGS="$(git tag --list 'v*')" RELEASE_COMMITS="$commits" \
            node .github/scripts/release-plan.mjs

      - name: Install dependencies
        if: steps.plan.outputs.action == 'version'
        run: bun install --frozen-lockfile

      - name: Install Vue dependencies
        if: steps.plan.outputs.action == 'version'
        run: bun install --cwd packages/yayaw-table-vue --frozen-lockfile

      # `changeset version` only reads changesets, so a release derived from the
      # commits is written as one first. It lands on the version branch only.
      - name: Write the derived changeset
        if: steps.plan.outputs.source == 'commits'
        env:
          RELEASE_BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          last="v$(node -p 'require("./package.json").version')"
          RELEASE_COMMITS="$(git log --no-merges --format=%s "${last}..HEAD")" \
            node --input-type=module --eval '
              import { writeFileSync } from "node:fs";
              const { derivedChangeset } = await import("./.github/scripts/release-plan.mjs");
              const commits = process.env.RELEASE_COMMITS.split("\n").filter(Boolean);
              writeFileSync(
                `.changeset/derived-${process.env.GITHUB_SHA.slice(0, 12)}.md`,
                derivedChangeset(process.env.RELEASE_BUMP, commits)
              );
            '

      # `version` consumes the changesets, syncs the Vue package and snapshots
      # the versioned registry, so the pull request carries the exact artifact
      # the tag will later verify.
      - name: Apply the changesets
        if: steps.plan.outputs.action == 'version'
        run: bun run version

      # GitHub holds CI triggered by bot-created PRs for approval. Validate the
      # exact proposed tree here as well; a failing release is never proposed.
      - name: Validate the release artifact
        if: steps.plan.outputs.action == 'version'
        run: |
          set -euo pipefail
          bun run release:check
          node .github/scripts/validate-pages-artifact.mjs dist/registry-pages
          node scripts/verify-registry-release.mjs "v$(node -p 'require("./package.json").version')"

      - name: Commit the release
        id: commit
        if: steps.plan.outputs.action == 'version'
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$VERSION_BRANCH"
          git add --all
          if git diff --cached --quiet; then
            echo "The changesets produced no change; nothing to propose."
            echo "proposed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --message "chore: release v${version}"
          {
            echo "proposed=true"
            echo "version=${version}"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Pages republishes bytes some run validated, never bytes built on main.
      # This branch's own CI waits for approval, so preserve the tarball this
      # job just validated under a name pinned to the commit it belongs to;
      # pages-provenance.mjs accepts it when no CI run exists for that commit.
      - name: Preserve the validated Pages artifact
        if: steps.commit.outputs.proposed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: registry-pages-${{ steps.commit.outputs.head }}
          path: dist/registry-pages
          retention-days: 30

      - name: Open or refresh the version pull request
        if: steps.commit.outputs.proposed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.commit.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          git push --force-with-lease origin "$VERSION_BRANCH"
          body=$(cat <<EOF
          Applies the pending changesets, syncs the Vue package version and snapshots the versioned registry under \`public/r/v${version}\`.

          This branch is pushed with \`GITHUB_TOKEN\`, so its pull request CI may require approval. Approve and wait for that CI before merging. The **Version and publish** run that produced it validated this exact tree with \`release:check\`, the Pages artifact validator and the snapshot verification, and preserved the artifact Pages will republish.

          Merging this pull request publishes: main then carries a described version with no tag, so this workflow tags \`v${version}\` and the release workflow attaches the pinned registry items.

          Add more changesets before merging to release them together.
          EOF
          )
          # `gh pr edit <branch>` resolves a branch to any pull request whose head
          # it is, including a merged one, so editing by branch name hands this
          # release's title and body to the previous release and never opens a
          # pull request. Only an open one can carry this release: find it first.
          open_pr=$(gh pr list --head "$VERSION_BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty' || true)
          if [ -n "$open_pr" ] && gh pr edit "$open_pr" \
            --title "chore: release v${version}" --body "$body"; then
            exit 0
          fi
          if gh pr create --base main --head "$VERSION_BRANCH" \
            --title "chore: release v${version}" --body "$body"; then
            exit 0
          fi
          # The branch is the artifact and it is pushed. Opening the pull request
          # needs "Allow GitHub Actions to create and approve pull requests" under
          # Settings > Actions > General; without it a maintainer opens it once.
          {
            echo "### Release v${version} is ready"
            echo
            echo "The version branch is pushed but this workflow may not open its pull request."
            echo "Enable **Allow GitHub Actions to create and approve pull requests** in"
            echo "Settings > Actions > General, or open it now:"
            echo
            echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${VERSION_BRANCH}?expand=1>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The version branch is ready, but its pull request could not be opened."
          exit 1

      # The versioned snapshot is verified before the tag exists, so a bad tree
      # never becomes a published tag.
      - name: Verify the versioned registry snapshot
        if: steps.plan.outputs.action == 'tag'
        run: node scripts/verify-registry-release.mjs "${{ steps.plan.outputs.tag }}"

      - name: Publish the tag
        if: steps.plan.outputs.action == 'tag'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.plan.outputs.tag }}" --message "${{ steps.plan.outputs.tag }}"
          git push origin "${{ steps.plan.outputs.tag }}"

      # A tag pushed with GITHUB_TOKEN starts no `push` run, so Release would
      # never fire and the tag would carry no GitHub release. workflow_dispatch
      # is the documented exception to that rule, so ask for the run explicitly.
      # It is requested on the tag, exactly as the push trigger would have.
      - name: Publish the GitHub release
        if: steps.plan.outputs.action != 'version'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            exit 0
          fi
          gh workflow run release.yml --ref "$RELEASE_TAG"
          # Prove the dispatch produced a run rather than assuming it did.
          for _ in $(seq 1 12); do
            if [ -n "$(gh run list --workflow release.yml --event workflow_dispatch \
              --branch "$RELEASE_TAG" --limit 1 --json databaseId --jq '.[].databaseId')" ]; then
              echo "Release run requested for ${RELEASE_TAG}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::${RELEASE_TAG} is tagged but no Release run started. Run the Release workflow on ${RELEASE_TAG} to attach the registry items."
          exit 1
