name: CI tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: table-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vue dependencies
        run: bun install --cwd packages/yayaw-table-vue --frozen-lockfile

      - name: Verify CI release guards
        run: node --test .github/scripts/*.test.mjs

      - name: Validate changesets
        run: bun run changeset:check

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Verify menu stability across repeated mounts
        run: bun test --preload ./tests/setup-dom.ts --rerun-each 5 tests/table-action-menus.test.tsx

      - name: Run Vue tests
        run: bun run vue:test

      - name: Build Vue package
        run: bun run vue:build

      - name: Build static registries
        run: bun run registry:pages

      - name: Validate registry artifact
        run: node .github/scripts/validate-pages-artifact.mjs dist/registry-pages

      # Keep each attempt immutable so a rerun cannot reuse an older artifact.
      - name: Preserve the validated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: registry-pages-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: dist/registry-pages
          retention-days: 30
