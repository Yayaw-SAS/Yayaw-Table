name: CI tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: table-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every check runs in its own job so the slowest one sets the pace instead of
# their sum: the React and Vue unit suites beside the quality job (builds, lint,
# types and the Pages artifact), and the end-to-end suite in four shards.
# `test-and-typecheck` stays the one required check and the job
# pages-provenance.mjs reads: it fails unless every job passed.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vue dependencies
        run: bun install --cwd packages/yayaw-table-vue --frozen-lockfile

      - name: Verify CI release guards
        run: node --test .github/scripts/*.test.mjs

      - name: Validate changesets
        run: bun run changeset:check

      - name: Lint
        run: bun run check

      - name: Type check
        run: bun run type-check

      - name: Build Vue package
        run: bun run vue:build

      - name: Build static registries
        run: bun run registry:pages

      - name: Validate registry artifact
        run: node .github/scripts/validate-pages-artifact.mjs dist/registry-pages

      - name: Check publication version
        id: publication
        run: node .github/scripts/registry-publication.mjs

      # Keep each attempt immutable so a rerun cannot reuse an older artifact.
      - name: Preserve the validated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: registry-pages-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}-${{ steps.publication.outputs.status }}
          path: dist/registry-pages
          retention-days: 30

  unit:
    name: unit (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [react, vue]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vue dependencies
        if: matrix.edition == 'vue'
        run: bun install --cwd packages/yayaw-table-vue --frozen-lockfile

      - name: Run React tests
        if: matrix.edition == 'react'
        run: bun run test

      - name: Verify menu stability across repeated mounts
        if: matrix.edition == 'react'
        run: bun test --preload ./tests/setup-dom.ts --rerun-each 5 tests/table-action-menus.test.tsx

      - name: Run Vue tests
        if: matrix.edition == 'vue'
        run: bun run vue:test

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    # The version pull request carries `main`'s code, which passed every shard
    # as an up-to-date pull request; its own changes are versions, the
    # changelog and the registry snapshot, which the quality job checks.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A red shard must not cancel the others: their results stay readable and
      # "Re-run failed jobs" then reruns that shard alone.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vue dependencies
        run: bun install --cwd packages/yayaw-table-vue --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The suite runs against built examples served statically, never against
      # dev servers that compile on demand under the parallel suite.
      - name: Build the React and Vue examples
        run: bun run e2e:build

      - name: Run end-to-end tests in both editions
        env:
          E2E_STATIC: "1"
        run: bunx playwright test --shard=${{ matrix.shard }}/4

  # A skipped job counts as passed for a required check: run always, fail unless all passed.
  test-and-typecheck:
    needs: [quality, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the quality job, both unit suites and every end-to-end shard
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.e2e.result }}" = success || { test "${{ needs.e2e.result }}" = skipped && test "${{ github.head_ref }}" = changeset-release/main; }
