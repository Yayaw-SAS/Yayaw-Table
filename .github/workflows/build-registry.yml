# Build the Shadcn registry (public/r) so the docs site can serve it.
# Run on push to main; commit updated public/r and registry files if changed.
name: Build registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build registry
        run: bun run registry:build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/r registry/default registry/registry.json
          git diff --staged --quiet || (git commit -m "chore: update registry build (public/r)" && git push)
