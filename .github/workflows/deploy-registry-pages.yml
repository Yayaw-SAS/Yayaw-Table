name: Deploy registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build registry artifact
        run: bun run registry:pages

      - name: Validate registry artifact
        run: |
          node -e 'for (const file of ["yayaw-table.json", "yayaw-table-base.json", "font-yayaw-sans.json", "yayaw-table-vue.json", "registry.json"]) JSON.parse(require("node:fs").readFileSync(`dist/registry-pages/r/${file}`, "utf8"));'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/registry-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy registry
        id: deployment
        uses: actions/deploy-pages@v4
