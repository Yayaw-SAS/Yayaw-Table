name: Deploy registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write
  pages: write

# Serialize publication without interrupting a Pages deployment already started.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted publication tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control-plane
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Authorize the validated PR artifact
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: node control-plane/.github/scripts/pages-provenance.mjs

      # Download only the immutable artifact from the verified successful attempt.
      # Its tarball is data: never extract or execute PR-supplied files here.
      - name: Download the validated Pages tarball
        if: steps.authorize.outputs.eligibility == 'eligible'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.authorize.outputs.artifact_id }}
          run-id: ${{ steps.authorize.outputs.quality_run_id }}
          github-token: ${{ github.token }}
          path: pages-artifact
          merge-multiple: true
          digest-mismatch: error

      - name: Recheck current main and artifact before publication
        if: steps.authorize.outputs.eligibility == 'eligible'
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ steps.authorize.outputs.artifact_id }}
        run: node control-plane/.github/scripts/pages-provenance.mjs

      - name: Configure GitHub Pages
        if: steps.current.outputs.eligibility == 'eligible'
        uses: actions/configure-pages@v6

      # deploy-pages looks in the current workflow run. Transfer the original
      # upload-pages-artifact tarball unchanged; no registry build is needed.
      - name: Transfer the validated tarball to this publication
        if: steps.current.outputs.eligibility == 'eligible'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: pages-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Deploy registry
        if: steps.current.outputs.eligibility == 'eligible'
        id: deployment
        uses: actions/deploy-pages@v5
