name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + p.version + "\n");'

      - name: Verify registry snapshot
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bun run release:verify -- "$GITHUB_REF_NAME"
          else
            bun run release:verify
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          release_notes=$(cat <<EOF
          YaYaw Table registry release.

          Install the latest registry item:

          \`\`\`bash
          npx shadcn@latest add https://table.yayaw.app/r/yayaw-table.json
          \`\`\`

          Install this pinned release:

          \`\`\`bash
          npx shadcn@latest add https://table.yayaw.app/r/${RELEASE_TAG}/yayaw-table.json
          \`\`\`

          The React and Vue registry items, optional base, and font are attached to this release.

          EOF
          )

          gh release create "$RELEASE_TAG" \
            public/r/"$RELEASE_TAG"/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "$release_notes"
